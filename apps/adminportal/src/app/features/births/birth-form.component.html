<form
  class="flex min-h-0 flex-1 flex-col"
  [formGroup]="form"
  (ngSubmit)="save()"
>
  <header class="border-b px-5 pt-5 pb-4 pe-14">
    <h2 class="text-lg font-semibold tracking-tight">
      {{ vocabulary(species()).birthVerb }}
    </h2>
    <p class="text-muted-foreground mt-0.5 text-sm">
      Choose the mother, then tag each {{ vocabulary(species()).young }}.
    </p>
    <app-page-guide
      class="mt-3"
      compact
      heading="Steps"
      [steps]="guideSteps()"
    />
  </header>

  <div class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto px-5 py-5">
    @if (error()) {
      <p
        class="bg-destructive/8 text-destructive flex items-start gap-2 rounded-lg px-3 py-2.5 text-sm"
        role="alert"
      >
        <ng-icon name="lucideTriangleAlert" size="16" class="mt-0.5 shrink-0" />
        {{ error() }}
      </p>
    }

    <div hlmField>
      <label hlmFieldLabel for="birth-dam">Mother</label>
      <app-select
        inputId="birth-dam"
        formControlName="damId"
        [options]="damOptions()"
        [placeholder]="'Choose a ' + vocabulary(species()).dam + '…'"
        emptyText="No living females recorded"
      />
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <div hlmField>
        <label hlmFieldLabel for="birth-kraal">{{
          vocabulary(species()).location | sentence
        }}</label>
        <app-select
          inputId="birth-kraal"
          formControlName="kraalId"
          [options]="kraalOptions()"
        />
      </div>
      <div hlmField>
        <label hlmFieldLabel for="birth-date">Date</label>
        <app-date-field inputId="birth-date" formControlName="date" />
      </div>
    </div>

    <fieldset class="flex flex-col gap-2" formArrayName="kids">
      <legend
        class="mb-2 flex w-full items-center justify-between text-sm font-medium"
      >
        {{ vocabulary(species()).youngPlural | sentence }} ({{ kids.length }})
      </legend>
      @for (kid of kids.controls; track kid; let i = $index) {
        <div
          class="bg-muted/50 grid grid-cols-[1fr_1fr_auto] items-center gap-2 rounded-lg p-2 sm:grid-cols-[1fr_1fr_8rem_auto]"
          [formGroupName]="i"
        >
          <input
            hlmInput
            formControlName="tag"
            placeholder="Ear tag"
            [attr.aria-label]="'Ear tag ' + (i + 1)"
          />
          <input
            hlmInput
            formControlName="name"
            placeholder="Name (optional)"
            [attr.aria-label]="'Name ' + (i + 1)"
          />
          <app-select
            class="col-span-2 sm:col-span-1"
            formControlName="sex"
            [options]="sexOptions()"
            [ariaLabel]="'Sex ' + (i + 1)"
          />
          <button
            type="button"
            hlmBtn
            variant="ghost"
            size="icon"
            class="text-muted-foreground hover:text-destructive row-start-1 col-start-3 sm:col-start-4"
            [disabled]="kids.length === 1"
            (click)="removeKid(i)"
            [attr.aria-label]="
              'Remove ' + vocabulary(species()).young + ' ' + (i + 1)
            "
          >
            <ng-icon name="lucideTrash2" />
          </button>
        </div>
      }
      <button
        type="button"
        hlmBtn
        variant="outline"
        class="w-full border-dashed"
        (click)="addKid()"
      >
        <ng-icon name="lucidePlus" />
        Add another {{ vocabulary(species()).young }}
      </button>
    </fieldset>

    <div hlmField>
      <label hlmFieldLabel for="birth-notes"
        >Notes
        <span class="text-muted-foreground font-normal">(optional)</span></label
      >
      <textarea
        id="birth-notes"
        hlmTextarea
        formControlName="notes"
        placeholder="Assisted? Weak at birth?"
      ></textarea>
    </div>
  </div>

  <footer
    class="bg-muted/40 flex flex-col-reverse gap-2 border-t px-5 pt-4 pb-[max(1rem,env(safe-area-inset-bottom))] md:flex-row md:justify-end md:pb-4 max-md:[&_[hlmBtn]]:h-12 max-md:[&_[hlmBtn]]:text-base"
  >
    <button type="button" hlmBtn variant="outline" (click)="modal.close()">
      Cancel
    </button>
    <button type="submit" hlmBtn [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Save ' + vocabulary(species()).birth }}
    </button>
  </footer>
</form>
