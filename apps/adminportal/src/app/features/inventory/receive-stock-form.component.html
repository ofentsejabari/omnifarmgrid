<form
  class="flex min-h-0 flex-1 flex-col"
  [formGroup]="form"
  (ngSubmit)="save()"
>
  <header class="border-b px-5 pt-5 pb-4 pe-14">
    <h2 class="text-lg font-semibold tracking-tight">Receive stock</h2>
    <p class="text-muted-foreground mt-0.5 text-sm">
      Log a new batch so it can be used when you vaccinate. The expiry date lets
      the app warn you 30 days before it runs out of date.
    </p>
    <app-page-guide class="mt-3" compact heading="Steps" [steps]="guideSteps" />
  </header>

  <div class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto px-5 py-5">
    @if (error()) {
      <p
        class="bg-destructive/8 text-destructive flex items-start gap-2 rounded-lg px-3 py-2.5 text-sm"
        role="alert"
      >
        <ng-icon name="lucideTriangleAlert" size="16" class="mt-0.5 shrink-0" />
        {{ error() }}
      </p>
    }
    <div hlmField>
      <label hlmFieldLabel for="receive-product">Product</label>
      <app-select
        inputId="receive-product"
        formControlName="productId"
        [options]="productOptions()"
        placeholder="Choose a product…"
      />
    </div>
    <div class="grid gap-4 sm:grid-cols-2">
      <div hlmField>
        <label hlmFieldLabel for="receive-qty">Quantity</label>
        <input
          id="receive-qty"
          hlmInput
          type="number"
          min="1"
          inputmode="numeric"
          formControlName="quantity"
        />
      </div>
      <div hlmField>
        <label hlmFieldLabel for="receive-batch"
          >Batch number
          <span class="text-muted-foreground font-normal"
            >(optional)</span
          ></label
        >
        <input id="receive-batch" hlmInput formControlName="batchNumber" />
      </div>
    </div>
    <div class="grid gap-4 sm:grid-cols-2">
      <div hlmField>
        <label hlmFieldLabel for="receive-expiry"
          >Expiry date
          <span class="text-muted-foreground font-normal"
            >(optional)</span
          ></label
        >
        <app-date-field
          inputId="receive-expiry"
          formControlName="expiryDate"
          placeholder="No expiry"
          [allowFuture]="true"
        />
      </div>
      <div hlmField>
        <label hlmFieldLabel for="receive-date">Received on</label>
        <app-date-field inputId="receive-date" formControlName="date" />
      </div>
    </div>
  </div>

  <footer
    class="bg-muted/40 flex flex-col-reverse gap-2 border-t px-5 pt-4 pb-[max(1rem,env(safe-area-inset-bottom))] md:flex-row md:justify-end md:pb-4 max-md:[&_[hlmBtn]]:h-12 max-md:[&_[hlmBtn]]:text-base"
  >
    <button type="button" hlmBtn variant="outline" (click)="modal.close()">
      Cancel
    </button>
    <button type="submit" hlmBtn [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Save batch' }}
    </button>
  </footer>
</form>
