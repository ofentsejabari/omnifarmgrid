<form class="fma-modal" [formGroup]="form" (ngSubmit)="save()">
  <header class="fma-modal-header">
    <h2 class="fma-modal-title">Add a product</h2>
    <p class="fma-modal-desc">
      A vaccine, dewormer or dip you keep in the medicine cupboard.
    </p>
  </header>

  <div class="fma-modal-body">
    @if (error()) {
      <p class="fma-error" role="alert">
        <ng-icon name="lucideTriangleAlert" size="16" class="mt-0.5 shrink-0" />
        {{ error() }}
      </p>
    }
    <div hlmField>
      <label hlmFieldLabel for="product-name">Name</label>
      <input
        id="product-name"
        hlmInput
        formControlName="name"
        placeholder="e.g. Pulpy kidney"
      />
    </div>
    <div class="fma-field-row">
      <div hlmField>
        <label hlmFieldLabel for="product-kind">Kind</label>
        <app-select
          inputId="product-kind"
          formControlName="kind"
          [options]="kindOptions"
        />
      </div>
      <div hlmField>
        <label hlmFieldLabel for="product-unit">Counted in</label>
        <app-select
          inputId="product-unit"
          formControlName="unit"
          [options]="unitOptions"
        />
      </div>
    </div>
    <div hlmField>
      <label hlmFieldLabel for="product-threshold"
        >Warn me when stock drops to</label
      >
      <input
        id="product-threshold"
        hlmInput
        type="number"
        min="0"
        formControlName="lowStockThreshold"
      />
    </div>
  </div>

  <footer class="fma-modal-footer">
    <button type="button" hlmBtn variant="outline" (click)="modal.close()">
      Cancel
    </button>
    <button type="submit" hlmBtn [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Add product' }}
    </button>
  </footer>
</form>
