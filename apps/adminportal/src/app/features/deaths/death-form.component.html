<section class="flex flex-col gap-5">
  <a routerLink="/" hlmBtn variant="link" size="sm" class="h-auto px-0">
    <ng-icon name="lucideArrowLeft" />
    Home
  </a>
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Record death</h1>
    <p class="text-muted-foreground text-sm">Mark an animal dead or culled and keep the reason.</p>
  </div>

  @if (error()) {
    <hlm-alert class="bg-warning/30 text-warning-foreground">
      <ng-icon name="lucideTriangleAlert" />
      <div hlmAlertDescription>{{ error() }}</div>
    </hlm-alert>
  }

  <form hlmCard [formGroup]="form" (ngSubmit)="save()">
    <div hlmCardContent class="flex flex-col gap-3">
      <div hlmField>
        <label hlmFieldLabel>Animal</label>
        <hlm-native-select formControlName="animalId">
          <option hlmNativeSelectOption value="">Select animal</option>
          @for (animal of animals(); track animal.id) {
            <option hlmNativeSelectOption [value]="animal.id">
              {{ label(animal) }}
            </option>
          }
        </hlm-native-select>
      </div>
      <div hlmField>
        <label hlmFieldLabel>Date</label>
        <input hlmInput type="date" formControlName="date" />
      </div>
      <div hlmField>
        <label hlmFieldLabel>Reason</label>
        <hlm-native-select formControlName="reason">
          @for (reason of reasons; track reason) {
            <option hlmNativeSelectOption [value]="reason">{{ reasonLabel(reason) }}</option>
          }
        </hlm-native-select>
      </div>
      <div hlmField>
        <label hlmFieldLabel>Notes</label>
        <textarea hlmTextarea formControlName="notes"></textarea>
      </div>
      <button type="submit" hlmBtn>Save death</button>
    </div>
  </form>
</section>
