<form
  class="flex min-h-0 flex-1 flex-col"
  [formGroup]="form"
  (ngSubmit)="save()"
>
  <header class="border-b px-5 pt-5 pb-4 pe-14">
    <h2 class="text-lg font-semibold tracking-tight">Record a death</h2>
    <p class="text-muted-foreground mt-0.5 text-sm">
      The animal is marked dead (or culled, for slaughter) and kept in its
      history.
    </p>
  </header>

  <div class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto px-5 py-5">
    @if (error()) {
      <p
        class="bg-destructive/8 text-destructive flex items-start gap-2 rounded-lg px-3 py-2.5 text-sm"
        role="alert"
      >
        <ng-icon name="lucideTriangleAlert" size="16" class="mt-0.5 shrink-0" />
        {{ error() }}
      </p>
    }

    <div hlmField>
      <label hlmFieldLabel for="death-animal">Animal</label>
      <app-select
        inputId="death-animal"
        formControlName="animalId"
        [options]="animalOptions()"
        placeholder="Choose an animal…"
        emptyText="No living animals"
      />
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <div hlmField>
        <label hlmFieldLabel for="death-reason">Reason</label>
        <app-select
          inputId="death-reason"
          formControlName="reason"
          [options]="reasonOptions()"
        />
      </div>
      <div hlmField>
        <label hlmFieldLabel for="death-date">Date</label>
        <app-date-field inputId="death-date" formControlName="date" />
      </div>
    </div>

    <div hlmField>
      <label hlmFieldLabel for="death-notes"
        >Notes
        <span class="text-muted-foreground font-normal">(optional)</span></label
      >
      <textarea
        id="death-notes"
        hlmTextarea
        formControlName="notes"
        placeholder="What did you notice?"
      ></textarea>
    </div>
  </div>

  <footer
    class="bg-muted/40 flex flex-col-reverse gap-2 border-t px-5 pt-4 pb-[max(1rem,env(safe-area-inset-bottom))] md:flex-row md:justify-end md:pb-4 max-md:[&_[hlmBtn]]:h-12 max-md:[&_[hlmBtn]]:text-base"
  >
    <button type="button" hlmBtn variant="outline" (click)="modal.close()">
      Cancel
    </button>
    <button type="submit" hlmBtn [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
  </footer>
</form>
