<div
  class="flex gap-3"
  [class]="
    layout() === 'stack' ? 'flex-col items-center text-center' : 'items-center'
  "
>
  <app-logo
    [size]="layout() === 'stack' ? 56 : 40"
    [inverse]="tone() === 'inverse'"
  />
  <div class="min-w-0">
    <p
      class="text-lg leading-tight font-semibold tracking-tight"
      [class.text-white]="tone() === 'inverse'"
    >
      OmniFarmGrid
    </p>
    <p
      class="text-sm"
      [class]="tone() === 'inverse' ? 'text-white/75' : 'text-muted-foreground'"
    >
      {{ tagline() }}
    </p>
  </div>
</div>
