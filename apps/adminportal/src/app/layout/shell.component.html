<div class="min-h-dvh pb-[calc(6.25rem+env(safe-area-inset-bottom))]">
  <header class="bg-card/80 sticky top-0 z-20 border-b border-border/80 shadow-sm backdrop-blur-xl">
    <div class="mx-auto flex max-w-3xl items-center justify-between gap-3 px-4 py-3.5">
      <div class="flex min-w-0 items-center gap-3">
        <img
          src="logo.png"
          alt="AgroHerd"
          class="size-11 shrink-0 rounded-xl object-cover shadow-sm ring-1 ring-primary/25"
        />
        <div class="min-w-0">
          <p class="leading-tight font-semibold tracking-tight">AgroHerd</p>
          <p class="text-muted-foreground truncate text-xs leading-tight">Farm records · goats, sheep, pigs</p>
        </div>
      </div>
      @if (onlineStore.online()) {
        <span hlmBadge variant="secondary" class="shrink-0 gap-1.5 font-medium">
          <span class="size-1.5 rounded-full bg-emerald-500"></span>
          Online
        </span>
      } @else {
        <span hlmBadge class="bg-warning/40 text-warning-foreground shrink-0 gap-1.5 font-medium">
          <span class="bg-warning-foreground/70 size-1.5 rounded-full"></span>
          Offline
        </span>
      }
    </div>
    <div class="mx-auto max-w-3xl px-4 pb-3">
      <div class="bg-muted/70 flex gap-1 rounded-full p-1 shadow-inner ring-1 ring-border/50">
        <button
          type="button"
          class="flex-1 rounded-full px-3 py-1.5 text-xs font-medium whitespace-nowrap transition-all"
          [class]="chipClass('all')"
          (click)="setFilter('all')"
        >
          All
        </button>
        @for (value of species; track value) {
          <button
            type="button"
            class="inline-flex flex-1 items-center justify-center gap-1 rounded-full px-3 py-1.5
              text-xs font-medium whitespace-nowrap transition-all"
            [class]="chipClass(value)"
            (click)="setFilter(value)"
          >
            <ng-icon [name]="copy(value).icon" size="14" />
            {{ speciesName(value) }}
          </button>
        }
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-3xl px-4 py-6">
    <router-outlet />
  </main>

  <nav
    class="bg-card/95 fixed inset-x-3 z-20 rounded-2xl border border-border/80 shadow-lg backdrop-blur-xl
      bottom-[max(0.75rem,env(safe-area-inset-bottom))]"
  >
    <div class="mx-auto grid max-w-3xl grid-cols-5 p-1">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive
          #navLink="routerLinkActive"
          [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
          class="relative flex flex-col items-center gap-0.5 rounded-xl py-2 text-[11px] font-medium
            transition-colors"
          [class.bg-primary/10]="navLink.isActive"
          [class.text-primary]="navLink.isActive"
          [class.text-muted-foreground]="!navLink.isActive"
        >
          <ng-icon [name]="item.icon" size="20" />
          {{ item.label }}
        </a>
      }
    </div>
  </nav>
</div>
